name: Brush Listening Records

on:
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * *"

permissions:
  contents: write

concurrency:
  group: brush
  cancel-in-progress: false

jobs:
  brush:
    runs-on: ubuntu-latest
    timeout-minutes: 360   # 6h 上限
    env:
      GOAL_TOTAL_PLAYS: "800"     # 此处可手动调成下次想刷到的累计目标
      MAX_SELF_RETRIES: "12"       # 最多自续刷 12 次（约 800 首 ÷ 80/批 ≈ 10 次，留 2 次冗余）
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run brush script
        env:
          NETEASE_PHONE: ${{ secrets.NETEASE_PHONE }}
          NETEASE_COUNTRY_CODE: ${{ secrets.NETEASE_COUNTRY_CODE }}
          NETEASE_PASSWORD: ${{ secrets.NETEASE_PASSWORD }}
          NETEASE_COOKIE: ${{ secrets.NETEASE_COOKIE }}
          NETEASE_MODE: ${{ secrets.NETEASE_MODE }}
          NETEASE_SPEED: ${{ secrets.NETEASE_SPEED }}
          NETEASE_MAX_DURATION: ${{ secrets.NETEASE_MAX_DURATION }}
          NETEASE_COUNT: ${{ secrets.NETEASE_COUNT }}
          NETEASE_PLAYLIST: ${{ secrets.NETEASE_PLAYLIST }}
          NETEASE_SONG_IDS: ${{ secrets.NETEASE_SONG_IDS }}
          NETEASE_INTERVAL: ${{ secrets.NETEASE_INTERVAL }}
        run: python main.py

      - name: Commit records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "chore: update listening records $(date -u +%F)"
            git push
          fi

      - name: Self-continue if goal not reached
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          GOAL="$GOAL_TOTAL_PLAYS"
          MAX_RETRIES="$MAX_SELF_RETRIES"
          if [ ! -f docs/data.json ]; then
            echo "no data.json yet, skip"
            exit 0
          fi
          CURRENT=$(jq -r '.totalPlays // 0' docs/data.json)
          REMAINING=$((GOAL - CURRENT))
          ITER_FILE=".brush_iter"
          ITER=$(cat "$ITER_FILE" 2>/dev/null || echo 0)
          echo "progress: totalPlays=$CURRENT, goal=$GOAL, remaining=$REMAINING, retry_iter=$ITER"
          if [ "$REMAINING" -gt 0 ] && [ "$ITER" -lt "$MAX_RETRIES" ]; then
            echo "self-dispatching next batch..."
            printf "%d" $((ITER+1)) > "$ITER_FILE"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$ITER_FILE"
            git commit -m "brush: iter $((ITER+1))" || echo "iter file unchanged"
            git push || true
            gh api repos/${{ github.repository }}/actions/workflows/brush.yml/dispatches -X POST -f ref=main > /dev/null
          else
            echo "goal reached or max retries hit, stop"
          fi
