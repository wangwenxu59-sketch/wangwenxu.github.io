name: Brush Listening Records

on:
  workflow_dispatch:       # 支持手动触发
  schedule:
    # UTC 时间 01:30 = 北京时间 09:30，每天执行一次
    # GitHub 定时任务可能延迟 5~30 分钟，属正常现象
    - cron: "30 1 * * *"

permissions:
  contents: write          # 允许提交 data.json 回仓库
  actions: write           # 允许 self-continue 触发下一批 workflow

concurrency:
  group: brush
  cancel-in-progress: false

jobs:
  brush:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          sudo apt-get update -qq && sudo apt-get install -y -qq jq > /dev/null

      - name: Run brush script
        env:
          NETEASE_COOKIES: ${{ secrets.NETEASE_COOKIES }}
          NETEASE_COOKIE: ${{ secrets.NETEASE_COOKIE }}
          NETEASE_MODE: ${{ secrets.NETEASE_MODE }}
          NETEASE_SPEED: ${{ secrets.NETEASE_SPEED }}
          NETEASE_MAX_DURATION: ${{ secrets.NETEASE_MAX_DURATION }}
          NETEASE_COUNT: ${{ secrets.NETEASE_COUNT }}
          NETEASE_GOAL: ${{ secrets.NETEASE_GOAL }}
          NETEASE_ACCOUNT_GAP: ${{ secrets.NETEASE_ACCOUNT_GAP }}
          NETEASE_PLAYLIST: ${{ secrets.NETEASE_PLAYLIST }}
          NETEASE_SONG_IDS: ${{ secrets.NETEASE_SONG_IDS }}
          NETEASE_INTERVAL: ${{ secrets.NETEASE_INTERVAL }}
        run: python main.py

      - name: Commit records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "chore: update listening records $(date -u +%F)"
            git push
          fi

      - name: Self-continue if goal not reached
        if: always()
        env:
          GOAL_TOTAL_PLAYS: 800
          MAX_SELF_RETRIES: 20
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          GOAL="$GOAL_TOTAL_PLAYS"
          MAX_RETRIES="$MAX_SELF_RETRIES"
          if [ ! -f docs/data.json ]; then
            echo "no data.json yet, skip"
            exit 0
          fi
          CURRENT=$(jq -r '.totalPlays // 0' docs/data.json)
          REMAINING=$((GOAL - CURRENT))
          ITER_FILE=".brush_iter"
          ITER=$(cat "$ITER_FILE" 2>/dev/null || echo 0)
          echo "progress: totalPlays=$CURRENT, goal=$GOAL, remaining=$REMAINING, retry_iter=$ITER"
          if [ "$REMAINING" -gt 0 ] && [ "$ITER" -lt "$MAX_RETRIES" ]; then
            echo "self-dispatching next batch..."
            printf "%d" $((ITER+1)) > "$ITER_FILE"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$ITER_FILE"
            git commit -m "brush: iter $((ITER+1))" || echo "iter file unchanged"
            git push || true
            gh api repos/wangwenxu59-sketch/wangwenxu.github.io/actions/workflows/brush.yml/dispatches -X POST -f ref=main > /dev/null
          else
            echo "goal reached or max retries hit, stop"
          fi
