<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>网易云听歌记录助手</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #f7f7f7;
    color: #333;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 40px 16px;
  }
  .wrap { width: 100%; max-width: 860px; }
  .header {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 28px;
  }
  .logo {
    width: 52px; height: 52px;
    background: linear-gradient(135deg, #ec4141, #c20c0c);
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 14px rgba(236, 65, 65, 0.35);
  }
  .logo svg { width: 28px; height: 28px; }
  .header h1 { font-size: 22px; font-weight: 700; }
  .header p { font-size: 13px; color: #999; margin-top: 3px; }
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
    margin-bottom: 24px;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    padding: 20px 22px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  .card .label { font-size: 13px; color: #999; }
  .card .value {
    font-size: 34px; font-weight: 700; margin-top: 6px;
    color: #ec4141;
    font-variant-numeric: tabular-nums;
  }
  .card.green .value { color: #2aae67; }
  .card.blue .value { color: #3b7ddd; }
  .panel {
    background: #fff;
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  .panel h2 { font-size: 16px; font-weight: 600; margin-bottom: 18px; }
  .chart {
    display: flex;
    align-items: flex-end;
    gap: 4px;
    height: 180px;
    border-bottom: 1px solid #eee;
    padding-bottom: 0;
  }
  .bar-box {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    height: 100%;
  }
  .bar {
    width: 100%;
    max-width: 34px;
    background: linear-gradient(180deg, #f86d6d, #ec4141);
    border-radius: 4px 4px 0 0;
    min-height: 2px;
    position: relative;
    transition: height .4s ease;
  }
  .bar:hover { filter: brightness(1.12); }
  .bar-box .d {
    font-size: 10px;
    color: #aaa;
    margin-top: 6px;
    white-space: nowrap;
  }
  .tooltip {
    position: absolute;
    top: -26px;
    left: 50%;
    transform: translateX(-50%);
    background: #333;
    color: #fff;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 4px;
    opacity: 0;
    pointer-events: none;
    white-space: nowrap;
    transition: opacity .15s;
  }
  .bar-box:hover .tooltip { opacity: 1; }
  .footer {
    text-align: center;
    font-size: 12px;
    color: #bbb;
    margin-top: 26px;
    line-height: 1.8;
  }
  .empty { color: #bbb; text-align: center; padding: 60px 0; font-size: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M9 18V6l10-2v12" stroke="#fff" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="6.5" cy="18" r="2.5" fill="#fff"/>
        <circle cx="16.5" cy="16" r="2.5" fill="#fff"/>
      </svg>
    </div>
    <div>
      <h1>网易云听歌记录助手</h1>
      <p id="updatedAt">GitHub Actions 自动运行 · 数据每次运行后自动更新</p>
    </div>
  </div>

  <div class="cards">
    <div class="card">
      <div class="label">今日播放量</div>
      <div class="value" id="today">--</div>
    </div>
    <div class="card green">
      <div class="label">累计播放量</div>
      <div class="value" id="total">--</div>
    </div>
    <div class="card blue">
      <div class="label">累计听歌时长</div>
      <div class="value" id="hours">--</div>
    </div>
    <div class="card blue">
      <div class="label">已运行天数</div>
      <div class="value" id="days">--</div>
    </div>
  </div>

  <div class="panel" id="totalPanel">
    <h2>近 30 天播放记录（全部账号汇总）</h2>
    <div class="chart" id="chart"></div>
    <div class="empty" id="empty" style="display:none">
      暂无数据，请在 GitHub Actions 完成一次运行后再来查看
    </div>
  </div>

  <div id="accountPanels"></div>

  <div class="footer">
    数据来源：仓库 docs/data.json，由 GitHub Actions 定时任务自动写入<br>
    Powered by GitHub Pages · 仅供个人学习使用
  </div>
</div>

  <script>
  // 本地预览（未部署）时的演示数据
  const DEMO = {
    totalPlays: 0,
    updatedAt: "",
    records: []
  };

  function todayStr(offset = 0) {
    const d = new Date(Date.now() - offset * 86400000);
    return d.toISOString().slice(0, 10);
  }

  // 渲染一张 30 天柱状图到指定容器
  function renderChart(container, records) {
    const days = [];
    for (let i = 29; i >= 0; i--) days.push(todayStr(i));
    const map = {};
    (records || []).forEach(r => { map[r.date] = r.plays; });
    const values = days.map(d => map[d] || 0);
    const max = Math.max(...values, 1);
    days.forEach((d, i) => {
      const v = values[i];
      const box = document.createElement('div');
      box.className = 'bar-box';
      const bar = document.createElement('div');
      bar.className = 'bar';
      bar.style.height = Math.max(2, v / max * 140) + 'px';
      const tip = document.createElement('div');
      tip.className = 'tooltip';
      tip.textContent = v + ' 次';
      bar.appendChild(tip);
      const label = document.createElement('div');
      label.className = 'd';
      label.textContent = d.slice(8) === '01' || i === 0 || i === 29 ? d.slice(5) : '';
      box.appendChild(bar);
      box.appendChild(label);
      container.appendChild(box);
    });
  }

  function render(data) {
    const today = todayStr();
    const todayRec = (data.records || []).find(r => r.date === today);
    document.getElementById('today').textContent = todayRec ? todayRec.plays : 0;
    document.getElementById('total').textContent = data.totalPlays || 0;
    document.getElementById('days').textContent = (data.records || []).length;

    // 累计听歌时长（秒 → 小时，保留 1 位）
    const secs = data.totalListenedSeconds || 0;
    const hoursEl = document.getElementById('hours');
    if (secs >= 3600) {
      hoursEl.textContent = (secs / 3600).toFixed(1);
      hoursEl.parentElement.querySelector('.label').textContent = '累计听歌时长（小时）';
    } else {
      hoursEl.textContent = Math.round(secs / 60);
      hoursEl.parentElement.querySelector('.label').textContent = '累计听歌时长（分钟）';
    }

    if (data.updatedAt) {
      document.getElementById('updatedAt').textContent =
        '最近更新：' + data.updatedAt.replace('T', ' ');
    }

    const chart = document.getElementById('chart');
    if (!data.records || data.records.length === 0) {
      chart.style.display = 'none';
      document.getElementById('empty').style.display = 'block';
    } else {
      renderChart(chart, data.records);
    }

    // 分账号面板（多账号模式下展示）
    const accounts = Array.isArray(data.accounts) ? data.accounts : null;
    if (accounts && accounts.length > 0) {
      const wrap = document.getElementById('accountPanels');
      accounts.forEach(acc => {
        const panel = document.createElement('div');
        panel.className = 'panel';
        panel.style.marginTop = '16px';

        const accToday = ((acc.records || []).find(r => r.date === today) || {}).plays || 0;
        const accSecs = acc.totalListenedSeconds || 0;
        const accHours = accSecs >= 3600 ? (accSecs / 3600).toFixed(1) + ' 小时'
                       : Math.round(accSecs / 60) + ' 分钟';

        const h2 = document.createElement('h2');
        h2.innerHTML = '🎵 ' + (acc.nickname || ('账号' + (Number(acc.id) + 1))) +
          '　<span style="font-size:13px;color:#999;font-weight:400">' +
          '今日 ' + accToday + ' · 累计 ' + (acc.totalPlays || 0) +
          ' · 听歌 ' + accHours + '</span>';
        panel.appendChild(h2);

        const sub = document.createElement('div');
        sub.className = 'chart';
        renderChart(sub, acc.records);
        panel.appendChild(sub);
        wrap.appendChild(panel);
      });
    }
  }

  fetch('data.json', { cache: 'no-store' })
    .then(r => r.ok ? r.json() : Promise.reject())
    .then(render)
    .catch(() => render(DEMO));
  </script>
</body>
</html>
