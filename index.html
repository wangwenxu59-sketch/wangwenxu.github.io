<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>共享文件打印站</title>
<style>
  :root {
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --bg: #f5f7fb;
    --card: #ffffff;
    --text: #1f2937;
    --muted: #6b7280;
    --border: #e5e7eb;
    --radius: 12px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    background: linear-gradient(135deg, #2563eb, #4f46e5);
    color: #fff;
    padding: 36px 20px 30px;
    text-align: center;
  }
  header h1 { font-size: 26px; font-weight: 700; letter-spacing: 1px; }
  header p { margin-top: 8px; opacity: .9; font-size: 14px; }
  .container { max-width: 960px; margin: 0 auto; padding: 24px 20px 60px; }

  .toolbar {
    display: flex; gap: 12px; align-items: center;
    margin-bottom: 20px; flex-wrap: wrap;
  }
  #search {
    flex: 1; min-width: 220px;
    padding: 11px 16px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    font-size: 14px;
    outline: none;
    background: var(--card);
    transition: border .2s, box-shadow .2s;
  }
  #search:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,.12); }
  .stats { font-size: 13px; color: var(--muted); white-space: nowrap; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
    gap: 16px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    display: flex; flex-direction: column; gap: 10px;
    transition: transform .15s, box-shadow .15s;
  }
  .card:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(31,41,55,.08);
  }
  .file-head { display: flex; align-items: center; gap: 12px; }
  .file-icon {
    width: 44px; height: 44px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; flex-shrink: 0;
  }
  .icon-pdf   { background: #fee2e2; }
  .icon-img   { background: #dbeafe; }
  .icon-text  { background: #dcfce7; }
  .icon-other { background: #f3f4f6; }
  .file-name {
    font-weight: 600; font-size: 14px;
    word-break: break-all; line-height: 1.4;
  }
  .file-meta { font-size: 12px; color: var(--muted); }
  .card-actions { display: flex; gap: 8px; margin-top: auto; }
  .btn {
    flex: 1;
    border: none; border-radius: 8px;
    padding: 9px 0;
    font-size: 13px; font-weight: 500;
    cursor: pointer;
    transition: background .15s, opacity .15s;
  }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-ghost { background: #eef2ff; color: var(--primary); }
  .btn-ghost:hover { background: #e0e7ff; }

  .empty {
    text-align: center; color: var(--muted);
    padding: 60px 20px; font-size: 14px; line-height: 2;
  }

  /* 预览弹窗 */
  .modal-mask {
    display: none;
    position: fixed; inset: 0;
    background: rgba(17,24,39,.55);
    z-index: 100;
    padding: 24px;
  }
  .modal-mask.open { display: flex; align-items: center; justify-content: center; }
  .modal {
    background: #fff;
    border-radius: 14px;
    width: min(860px, 100%);
    max-height: 92vh;
    display: flex; flex-direction: column;
    overflow: hidden;
    box-shadow: 0 24px 60px rgba(0,0,0,.25);
  }
  .modal-header {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
  }
  .modal-header .title {
    flex: 1; font-weight: 600; font-size: 15px;
    word-break: break-all;
  }
  .modal-header .btn { flex: none; padding: 8px 18px; }
  .close-x {
    border: none; background: #f3f4f6; color: var(--text);
    width: 34px; height: 34px; border-radius: 8px;
    font-size: 16px; cursor: pointer; flex-shrink: 0;
  }
  .close-x:hover { background: #e5e7eb; }
  .modal-body {
    flex: 1; overflow: auto;
    padding: 18px;
    background: #fafafa;
  }
  .modal-body iframe { width: 100%; height: 65vh; border: 1px solid var(--border); border-radius: 8px; background: #fff; }
  .modal-body img.preview-img { max-width: 100%; display: block; margin: 0 auto; border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,.1); }
  .modal-body pre {
    white-space: pre-wrap; word-break: break-word;
    font-family: "SFMono-Regular", Consolas, monospace;
    font-size: 13px; line-height: 1.7;
    background: #fff; padding: 20px;
    border: 1px solid var(--border); border-radius: 8px;
  }
  .hint { font-size: 13px; color: var(--muted); line-height: 1.8; padding: 10px 0; }

  footer {
    text-align: center; color: var(--muted);
    font-size: 12px; padding: 30px 20px; line-height: 2;
  }
  footer a { color: var(--primary); text-decoration: none; }

  @media (max-width: 560px) {
    header h1 { font-size: 20px; }
    .modal-header { flex-wrap: wrap; }
  }
</style>
</head>
<body>

<header>
  <h1 id="siteName">📄 共享文件打印站</h1>
  <p id="siteSub">文件共享 · 在线预览 · 一键打印</p>
</header>

<div class="container">
  <div class="toolbar">
    <input id="search" type="search" placeholder="🔍 搜索文件名…" autocomplete="off">
    <span class="stats" id="stats"></span>
  </div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none"></div>
</div>

<!-- 预览弹窗 -->
<div class="modal-mask" id="mask">
  <div class="modal">
    <div class="modal-header">
      <div class="title" id="modalTitle"></div>
      <button class="btn btn-primary" onclick="printCurrent()">🖨 打印</button>
      <button class="btn btn-ghost" onclick="downloadCurrent()">⬇ 下载</button>
      <button class="close-x" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<footer>
  将文件放入仓库 <b>files/</b> 文件夹并推送，文件列表自动更新 · 通过 GitHub Pages 免费访问<br>
  Powered by GitHub Pages · 简单 · 便捷 · 免费托管
</footer>

<script>
/* ================= 可自定义配置 ================= */
const CONFIG = {
  siteName: "共享文件打印站",
  subtitle: "文件共享 · 在线预览 · 一键打印",
  manifest: "files.json"   // 文件清单（由 GitHub Actions 自动生成）
};
/* =============================================== */

document.getElementById("siteName").textContent = "📄 " + CONFIG.siteName;
document.getElementById("siteSub").textContent = CONFIG.subtitle;

let FILES = [];
let current = null;   // 当前预览的文件

const IMG_EXT  = ["jpg","jpeg","png","gif","webp","bmp","svg"];
const TXT_EXT  = ["txt","md","log","csv","json","xml","html","js","css","py"];

function extOf(path) {
  const m = path.toLowerCase().match(/\.([a-z0-9]+)$/);
  return m ? m[1] : "";
}
function typeOf(f) {
  const e = extOf(f.path);
  if (e === "pdf") return "pdf";
  if (IMG_EXT.includes(e)) return "img";
  if (TXT_EXT.includes(e)) return "text";
  return "other";
}
function fmtSize(b) {
  if (b < 1024) return b + " B";
  if (b < 1048576) return (b/1024).toFixed(1) + " KB";
  return (b/1048576).toFixed(2) + " MB";
}
function fmtDate(s) {
  if (!s) return "";
  return String(s).replace("T", " ").slice(0, 16);
}

const ICONS = {
  pdf:  { icon: "📕", cls: "icon-pdf",  label: "PDF" },
  img:  { icon: "🖼️", cls: "icon-img",  label: "图片" },
  text: { icon: "📝", cls: "icon-text", label: "文本" },
  other:{ icon: "📦", cls: "icon-other",label: "文件" }
};

function render() {
  const kw = document.getElementById("search").value.trim().toLowerCase();
  const list = FILES.filter(f => f.name.toLowerCase().includes(kw));
  const grid = document.getElementById("grid");
  const empty = document.getElementById("empty");
  grid.innerHTML = "";

  document.getElementById("stats").textContent = `共 ${FILES.length} 个文件`;
  empty.style.display = "none";

  if (!list.length) {
    empty.style.display = "block";
    empty.innerHTML = FILES.length
      ? `没有匹配 “${kw}” 的文件`
      : `<b>还没有共享文件</b><br>将文件放入仓库的 <b>files/</b> 文件夹并推送到 GitHub<br>文件列表会由 GitHub Actions 自动更新`;
    return;
  }

  list.forEach((f, i) => {
    const t = typeOf(f);
    const meta = ICONS[t];
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="file-head">
        <div class="file-icon ${meta.cls}">${meta.icon}</div>
        <div>
          <div class="file-name">${escapeHtml(f.name)}</div>
          <div class="file-meta">${meta.label} · ${fmtSize(f.size || 0)}${f.date ? " · " + fmtDate(f.date) : ""}</div>
        </div>
      </div>
      <div class="card-actions">
        <button class="btn btn-ghost" data-act="preview">👁 预览</button>
        <button class="btn btn-primary" data-act="print">🖨 打印</button>
      </div>`;
    card.querySelector('[data-act="preview"]').onclick = () => openPreview(f);
    card.querySelector('[data-act="print"]').onclick  = () => openPreview(f, true);
    grid.appendChild(card);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

/* ---------- 预览 ---------- */
function openPreview(f, autoPrint) {
  current = f;
  document.getElementById("modalTitle").textContent = f.name;
  const body = document.getElementById("modalBody");
  body.innerHTML = "";
  const t = typeOf(f);

  if (t === "pdf") {
    const iframe = document.createElement("iframe");
    iframe.src = f.path;
    body.appendChild(iframe);
    if (autoPrint) {
      const hint = document.createElement("div");
      hint.className = "hint";
      hint.textContent = "提示：PDF 已加载，若未自动弹出打印窗口，请稍候或在预览框内按 Ctrl+P。";
      body.appendChild(hint);
      iframe.onload = () => setTimeout(() => {
        try { iframe.contentWindow.focus(); iframe.contentWindow.print(); } catch (e) {}
      }, 600);
    }
  } else if (t === "img") {
    const img = document.createElement("img");
    img.className = "preview-img";
    img.src = f.path;
    body.appendChild(img);
    if (autoPrint) setTimeout(() => printCurrent(), 300);
  } else if (t === "text") {
    fetch(f.path).then(r => r.text()).then(txt => {
      const pre = document.createElement("pre");
      pre.textContent = txt;
      body.innerHTML = "";
      body.appendChild(pre);
      if (autoPrint) setTimeout(() => printCurrent(), 200);
    }).catch(() => {
      body.innerHTML = '<div class="hint">无法读取文件内容，请直接下载后打开。</div>';
    });
  } else {
    body.innerHTML = '<div class="hint">该文件类型不支持在线预览，请点击「下载」保存后打开或打印。</div>';
  }
  document.getElementById("mask").classList.add("open");
}

function closeModal() {
  document.getElementById("mask").classList.remove("open");
  document.getElementById("modalBody").innerHTML = "";
  current = null;
}
document.getElementById("mask").addEventListener("click", e => {
  if (e.target === e.currentTarget) closeModal();
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

function downloadCurrent() {
  if (!current) return;
  const a = document.createElement("a");
  a.href = current.path;
  a.download = current.name;
  a.click();
}

/* ---------- 打印 ---------- */
function printCurrent() {
  if (!current) return;
  const t = typeOf(current);
  if (t === "pdf") {
    // 直接打印内嵌 PDF
    const iframe = document.querySelector("#modalBody iframe");
    if (iframe) { try { iframe.contentWindow.focus(); iframe.contentWindow.print(); return; } catch (e) {} }
    window.open(current.path, "_blank");
    return;
  }
  if (t === "img") {
    printHtml(`<img src="${current.path}" style="max-width:100%">`, current.name);
    return;
  }
  if (t === "text") {
    fetch(current.path).then(r => r.text()).then(txt => {
      printHtml(`<pre style="white-space:pre-wrap;font-family:Consolas,monospace;font-size:12pt;line-height:1.7">${escapeHtml(txt)}</pre>`, current.name);
    });
    return;
  }
  window.open(current.path, "_blank");
}

function printHtml(innerHtml, title) {
  const iframe = document.createElement("iframe");
  iframe.style.cssText = "position:fixed;right:0;bottom:0;width:0;height:0;border:0;";
  document.body.appendChild(iframe);
  const doc = iframe.contentDocument;
  doc.open();
  doc.write(`<!DOCTYPE html><html><head><meta charset="utf-8"><title>${escapeHtml(title || "")}</title>
    <style>@page{margin:15mm} body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;padding:10px}</style>
    </head><body>${innerHtml}</body></html>`);
  doc.close();
  iframe.onload = () => {
    setTimeout(() => {
      iframe.contentWindow.focus();
      iframe.contentWindow.print();
      setTimeout(() => iframe.remove(), 2000);
    }, 300);
  };
}

/* ---------- 加载清单 ---------- */
document.getElementById("search").addEventListener("input", render);

fetch(CONFIG.manifest)
  .then(r => { if (!r.ok) throw new Error("manifest missing"); return r.json(); })
  .then(data => { FILES = Array.isArray(data) ? data : []; render(); })
  .catch(() => {
    FILES = []; render();
    const empty = document.getElementById("empty");
    empty.innerHTML =
      '<b>未找到 files.json 文件清单</b><br>' +
      '· 部署在 GitHub 时：推送后 Action 会自动生成<br>' +
      '· 本地预览时：在项目目录运行 <code>python generate_manifest.py</code>，再执行 <code>python -m http.server</code> 打开 <code>http://localhost:8000</code>';
  });
</script>
</body>
</html>
